<script>
'use strict';
let state={config:{},profiles:[],backups:[]}, jobs=new Map(), hiddenJobs=new Set(), modalKind='', detailId='', previousFocus=null;
const dismissAnimations=new Map();
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const paths={edit:'M4 20l4-1 12-12-4-4L4 15z M13 6l4 4',trash:'M3 6h18 M9 6V3h6v3 M5 6l1 15h12l1-15 M10 10v7 M14 10v7'};
const icon=name=>name==='settings'?'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--accent)" stroke="none" fill-rule="evenodd" d="M9 2h6v3h3V3h3v3h-2v3h3v6h-3v3h2v3h-3v-2h-3v3H9v-3H6v2H3v-3h2v-3H2V9h3V6H3V3h3v2h3z M9 9v6h6V9z"></path></svg>':`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"></path></svg>`;
$('settingsButton').innerHTML=icon('settings');
function send(action,data={}){if(window.ipc)window.ipc.postMessage(JSON.stringify({action,data}));else toast('Preview only: run the EXE to use backup actions.');}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;setTimeout(()=>$('toast').hidden=true,7000)}
function receive(message){
 if(message.type==='update')renderUpdate(message);
 if(message.type==='snapshot'){state=message;renderCards();if(message.closeModal)closeModal();}
 if(message.type==='picked'){const field=$(message.field);if(field)field.value=message.path;}
 if(message.type==='error'){if(!$('overlay').hidden){$('modalError').textContent=message.message;const submit=$('submit');if(submit)submit.disabled=false;}else toast(message.message);}
 if(message.type==='job'||message.type==='finished'){const old=jobs.get(message.id)||{};jobs.set(message.id,{...old,...message});if(message.type==='job'&&message.name){closeModal();}renderJobs();if(modalKind==='details'&&detailId===message.id)updateDetails();
  const dismissible=['complete','cancelled','failed'].includes(message.state);
  if(!dismissible||old.state!==message.state){dismissAnimations.get(message.id)?.cancel();dismissAnimations.delete(message.id);}
  if(dismissible&&old.state!==message.state&&!hiddenJobs.has(message.id)){
   const seconds=state.config.CompletedStatusDismissSeconds??5;
   if(seconds>0){
    const chip=[...$('statuses').children].find(e=>e.dataset.jobId===message.id);
    const animation=chip.querySelector('.dismiss-fill').animate([{transform:'scaleX(0)'},{transform:'scaleX(1)'}],{duration:seconds*1000,easing:'linear',fill:'forwards'});
    dismissAnimations.set(message.id,animation);
    animation.onfinish=()=>dismissStatus(message.id);
   }
  }
 }
}
function cardButton(label,action,svg){const b=document.createElement('button');b.className='icon';b.title=label;b.setAttribute('aria-label',label);b.innerHTML=icon(svg);b.onclick=action;return b;}
function renderCards(){
 $('profiles').replaceChildren();$('backups').replaceChildren();
 for(const profile of state.profiles){const card=document.createElement('div');card.className='card profile';const auto=document.createElement('span');auto.className='auto';auto.innerHTML='auto <span class="dot"></span>';auto.title='Automation unavailable';card.append(auto);const name=document.createElement('button');name.className='name';name.textContent=profile.name.replace(/\{(?:year|month|day|hour|minute|second|time)\}/g,'').replace(/^[\s_-]+|[\s_-]+$/g,'')||'Profile';name.title=`Back up ${profile.source}`;name.onclick=()=>start({name:profile.name,source:profile.source,zip:profile.zip});card.append(name,cardButton('Edit profile',()=>profileDialog(profile),'edit'),cardButton('Delete profile',()=>deleteDialog('profile',profile),'trash'));$('profiles').append(card);}
 for(const backup of state.backups){const card=document.createElement('div');card.className='card';const name=document.createElement('button');name.className='name';name.textContent=backup.name;name.title='Open in Explorer';name.onclick=()=>send('openBackup',{name:backup.name});card.append(name,cardButton('Rename backup',()=>renameDialog(backup),'edit'),cardButton('Delete backup',()=>deleteDialog('backup',backup),'trash'));$('backups').append(card);}
 if(!state.profiles.length)$('profiles').innerHTML='<div class="empty">No profiles yet. Click + Create a profile to get started.</div>';
 if(!state.backups.length)$('backups').innerHTML='<div class="empty">No backups yet. Click + Create a backup to get started.</div>';
}
function renderUpdate(message){
 let chip=$('updateStatus');
 if(!message.version)return;
 if(!chip){
  chip=document.createElement('div');chip.id='updateStatus';chip.className='status update-status';
  const row=document.createElement('div');row.className='status-row';
  const update=document.createElement('button');update.className='close';update.textContent='Update';
  update.onclick=()=>{
   if([...jobs.values()].some(job=>job.state==='running')){toast('Wait for running backups before updating.');return;}
   update.disabled=true;send('performUpdate');
  };
  const label=document.createElement('button');label.className='label';label.title='Open latest GitHub release';
  label.onclick=()=>send('openUpdateRelease');
  row.append(update,label);chip.append(row);$('statuses').prepend(chip);
 }
 chip.querySelector('.label').textContent=message.busy?'Downloading update…':message.version+' available';
 chip.querySelector('.close').disabled=!!message.busy;
 if(message.error)toast(message.error);
}

function dismissStatus(id){const animation=dismissAnimations.get(id);if(animation){animation.onfinish=null;animation.cancel();dismissAnimations.delete(id);}hiddenJobs.add(id);renderJobs();if(!(modalKind==='details'&&detailId===id)){jobs.delete(id);hiddenJobs.delete(id);}}
function renderJobs(){
 const container=$('statuses');
 for(const chip of [...container.children])if(chip.dataset.jobId&&(hiddenJobs.has(chip.dataset.jobId)||!jobs.has(chip.dataset.jobId)))chip.remove();
 for(const [id,job] of jobs){
  if(hiddenJobs.has(id))continue;
  let chip=[...container.children].find(e=>e.dataset.jobId===id);
  if(!chip){
   chip=document.createElement('div');chip.dataset.jobId=id;
   const row=document.createElement('div');row.className='status-row';
   const x=document.createElement('button');x.className='close';x.textContent='×';x.onclick=()=>jobs.get(id)?.state==='running'?cancelDialog(id):dismissStatus(id);
   const label=document.createElement('button');label.className='label';label.title='Click for backup details';label.onclick=()=>detailsDialog(id);
   const dot=document.createElement('span');dot.className='dot';row.append(x,label,dot);
   const progress=document.createElement('progress');progress.max=100;
   const percent=document.createElement('small');
   const track=document.createElement('div');track.className='dismiss-track';track.setAttribute('role','timer');track.hidden=true;
   const fill=document.createElement('span');fill.className='dismiss-fill';track.append(fill);
   const meter=document.createElement('div');meter.className='status-meter';meter.append(progress,percent,track);chip.append(row,meter);container.append(chip);
  }
  const className=`status ${job.state}`;if(chip.className!==className)chip.className=className;
  const x=chip.querySelector('.close');x.title=job.state==='running'?'Cancel backup':'Dismiss status';x.setAttribute('aria-label',x.title);x.disabled=job.state==='running'&&!!job.cancelRequested;
  const label=chip.querySelector('.label'),text=`${job.name||'Backup'}: ${job.state}`;if(label.textContent!==text)label.textContent=text;
  const progress=chip.querySelector('progress');progress.value=job.percent||0;progress.setAttribute('aria-label',`${job.name} progress`);
  const percent=chip.querySelector('small'),value=`${job.percent||0}%`;if(percent.textContent!==value)percent.textContent=value;
  const track=chip.querySelector('.dismiss-track'),timed=['complete','cancelled','failed'].includes(job.state)&&(dismissAnimations.has(id)||(state.config.CompletedStatusDismissSeconds??5)>0);
  progress.hidden=timed;percent.hidden=timed;track.hidden=!timed;
  track.setAttribute('aria-label',`Status dismisses after ${state.config.CompletedStatusDismissSeconds??5} seconds`);
 }
}
function openModal(title,html,kind,wide=false){if($('overlay').hidden)previousFocus=document.activeElement;modalKind=kind;$('modalTitle').textContent=title;$('modalContent').innerHTML=html+'<div id="modalError" class="error" role="alert"></div>';$('dialog').classList.toggle('wide',wide);$('overlay').hidden=false;document.querySelector('main').inert=true;setTimeout(()=>{$('modalContent').querySelector('input,select,button')?.focus()},0)}
function closeModal(){if(hiddenJobs.has(detailId)){jobs.delete(detailId);hiddenJobs.delete(detailId);}$('overlay').hidden=true;document.querySelector('main').inert=false;modalKind='';detailId='';previousFocus?.focus();}
$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const focusable=[...$('dialog').querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea')].filter(e=>e.getClientRects().length);const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
function field(name,label,value='',hint=''){return `<div class="field"><label for="${name}">${label}</label><input type="text" id="${name}" value="${esc(value)}"><span class="hint">${hint}</span></div>`}
function sourceField(value=''){return field('source','Location',value)+`<div class="picker"><button type="button" onclick="send('pick',{folder:false,field:'source'})">Browse file</button><button type="button" onclick="send('pick',{folder:true,field:'source'})">Browse folder</button></div>`}
function toggle(id,label,checked=false,disabled=false){return `<div class="toggle-row"><label for="${id}">${label}</label><input type="checkbox" class="switch" id="${id}" ${checked?'checked':''} ${disabled?'disabled':''} aria-label="${label}"></div>`}
function backupDialog(){openModal('Create Backup',`<form id="form">${field('name','Name','backup-{year}-{month}-{day}','Placeholders: {year} {month} {day} {time}')}${sourceField()}<br>${toggle('zip','ZIP')}<span class="hint">Save to ${esc(state.config.BackupRoot)}. Use an existing folder name to add/update files.</span><button id="submit" class="primary">Create</button></form>`,'backup');$('form').onsubmit=e=>{e.preventDefault();start({name:$('name').value,source:$('source').value,zip:$('zip').checked})}}
function profileDialog(profile={id:'',name:'backup-{year}-{month}-{day}',source:'',zip:false}){openModal(profile.id?'Edit Profile':'Create Profile',`<form id="form">${field('name','Profile name',profile.name,'Placeholders: {year} {month} {day} {time}<br>Dates only appear in ZIP or folder backup names.')}${sourceField(profile.source)}<br>${toggle('zip','ZIP',profile.zip)}${toggle('auto','Auto — unavailable',false,true)}<span class="hint">Click the saved profile to create a normal backup. Scheduling is unavailable.</span><button class="primary" id="submit">${profile.id?'Save':'Create'}</button></form>`,'profile');$('form').onsubmit=e=>{e.preventDefault();send('saveProfile',{id:profile.id,name:$('name').value,source:$('source').value,zip:$('zip').checked})}}
function stamp(name){const d=new Date(),pad=n=>String(n).padStart(2,'0');const values={year:d.getFullYear(),month:pad(d.getMonth()+1),day:pad(d.getDate()),hour:pad(d.getHours()),minute:pad(d.getMinutes()),second:pad(d.getSeconds()),time:pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())};return name.replace(/\{(\w+)\}/g,(m,k)=>values[k]??m)}
function start(request){
 if(!request.name.trim()||!request.source.trim()){if($('modalError'))$('modalError').textContent='Enter a name and choose a source.';return;}
 const generated=stamp(request.name), target=request.zip?generated.replace(/\.zip$/,'')+'.zip':generated;
 const existing=state.backups.find(b=>b.name.toLowerCase()===target.toLowerCase());
 if(existing&&!request.overwrite){openModal(request.zip?'Replace ZIP backup?':'Update existing backup?',`<p>${esc(target)} already exists.</p><p>${request.zip?'Replace this ZIP after the new archive has been verified?':'Add files and folders to this backup? Matching files follow your overwrite setting.'}</p><div class="actions"><button onclick="closeModal()">Cancel</button><button id="confirm" class="danger">${request.zip?'Confirm overwrite':'Confirm update'}</button></div>`,'overwrite');$('confirm').onclick=()=>{request.overwrite=true;send('start',request)};return;}
 send('start',request);
}
function compressDialog(){const folders=state.backups.filter(b=>!b.zip);openModal('Compress Backup',`<form id="form"><div class="field"><label for="existing">Backup folder</label><select id="existing">${folders.map(b=>`<option>${esc(b.name)}</option>`).join('')}</select></div>${field('name','ZIP name',folders[0]?.name||'')}<span class="hint">The original folder stays intact. Compression level: ${state.config.CompressionLevel}.</span><button class="primary" id="submit" ${folders.length?'':'disabled'}>Compress</button></form>`,'compress');$('existing').onchange=()=>{$('name').value=$('existing').value};$('form').onsubmit=e=>{e.preventDefault();start({name:$('name').value,source:state.backupLocation+'\\'+$('existing').value,zip:true})};}
// Rust resolves the configured backup folder for compression, rather than trusting a guessed EXE path.
function renameDialog(backup){openModal('Rename Backup',`<form id="form">${field('name','Name',backup.name)}<button class="primary" id="submit">Save</button></form>`,'rename');$('form').onsubmit=e=>{e.preventDefault();send('renameBackup',{old:backup.name,name:$('name').value})}}
function deleteDialog(type,item){openModal('Delete '+(type==='profile'?'Profile':'Backup'),`<p>Are you sure you want to delete <strong>${esc(item.name)}</strong>?</p>${type==='profile'?'<p class="hint">Existing backups will stay intact.</p>':''}<div class="actions"><button onclick="closeModal()">Cancel</button><button class="danger" id="confirm">Confirm</button></div>`,'delete');$('confirm').onclick=()=>send(type==='profile'?'deleteProfile':'deleteBackup',{id:item.id,name:item.name,confirmed:true})}
function settingsDialog(){const c=state.config;openModal('Settings',`<form id="form"><div class="settings-grid"><div class="span2">${field('backupRoot','Backup folder',c.BackupRoot)}<div class="picker"><button type="button" onclick="send('pick',{folder:true,field:'backupRoot'})">Browse folder</button></div><br>${field('logRoot','Log folder',c.LogDirectory)}<div class="picker"><button type="button" onclick="send('pick',{folder:true,field:'logRoot'})">Browse folder</button></div><br></div><div class="field"><label for="compression">ZIP compression</label><div class="slider-line"><input type="range" id="compression" min="0" max="6" step="1" value="${[0,1,3,5,6,7,9].indexOf(c.CompressionLevel)}" oninput="this.nextElementSibling.value=[0,1,3,5,6,7,9][this.value]"><output>${c.CompressionLevel}</output></div><span class="hint">Default 6. Higher levels take more time.</span></div><div class="field"><label for="logCompression">Log compression</label><div class="slider-line"><input type="range" id="logCompression" min="0" max="9" value="${c.LogCompressionLevel}" oninput="this.nextElementSibling.value=this.value"><output>${c.LogCompressionLevel}</output></div></div><div class="span2">${field('dateFormat','Log date format',c.DateFormat,'{year} {month} {day} {hour} {minute} {second} {time}')}</div><div class="field"><label for="excludeFiles">Exclude files</label><textarea id="excludeFiles">${esc(c.ExcludeFiles?.join('\n'))}</textarea><span class="hint">One pattern per line, for example *.tmp.</span></div><div class="field"><label for="excludeFolders">Exclude folders</label><textarea id="excludeFolders">${esc(c.ExcludeFolders?.join('\n'))}</textarea><span class="hint">One name or pattern per line.</span></div><div class="span2">${toggle('overwrite','Overwrite matching files',c.OverwriteExistingFiles)}</div><div class="span2">${toggle('closeToTray','Close to tray',c.CloseToTray??true)}<span class="hint">Keep FileBackup running in the background when you close its window.</span></div><div class="span2">${toggle('trayNotifications','Tray notifications',c.TrayNotificationsEnabled??true)}<span class="hint">Show a Windows notification when FileBackup hides to the tray.</span></div><div class="span2 field"><label for="completedDismiss">Status dismissal (seconds)</label><input type="number" id="completedDismiss" min="0" max="3600" step="1" required value="${c.CompletedStatusDismissSeconds??5}"><span class="hint">Default 5. Completed, cancelled, and failed statuses dismiss after this delay. Set 0 to keep them visible.</span></div><div class="field"><label for="retries">Copy retries</label><input type="number" id="retries" min="0" max="100" value="${c.CopyRetries}"></div><div class="field"><label for="retryDelay">Retry delay (seconds)</label><input type="number" id="retryDelay" min="0" max="300" value="${c.RetryDelaySeconds}"></div></div><span class="hint">Changes apply to new jobs. Settings cannot change while a backup is running.</span><button class="primary" id="submit">Save</button></form>`,'settings',true);$('form').onsubmit=e=>{e.preventDefault();const lines=id=>$(id).value.split('\n').map(v=>v.trim()).filter(Boolean);send('saveSettings',{CompressionLevel:[0,1,3,5,6,7,9][Number($('compression').value)],LogCompressionLevel:Number($('logCompression').value),DateFormat:$('dateFormat').value,BackupRoot:$('backupRoot').value,LogDirectory:$('logRoot').value,ExcludeFiles:lines('excludeFiles'),ExcludeFolders:lines('excludeFolders'),OverwriteExistingFiles:$('overwrite').checked,CopyRetries:Number($('retries').value),RetryDelaySeconds:Number($('retryDelay').value),CloseToTray:$('closeToTray').checked,TrayNotificationsEnabled:$('trayNotifications').checked,CompletedStatusDismissSeconds:Number($('completedDismiss').value)})}}
function size(bytes=0){for(const [unit,divisor] of [['GB',1073741824],['MB',1048576],['KB',1024]])if(bytes>=divisor)return(bytes/divisor).toFixed(2).replace(/\.00$/,'')+' '+unit;return bytes+' B'}
function detailsDialog(id){
 openModal('Backup Status','<div id="jobDetails" class="details"><strong id="jobTitle"></strong><progress id="jobProgress" class="progress-main" max="100"></progress><p id="jobPercent"></p><p>Source: <span id="jobSource"></span><br>Destination: <span id="jobDestination"></span></p><p>Files: <span id="jobFiles"></span><br>Processed: <span id="jobBytes"></span></p><div id="jobDetail" class="job-detail"></div><button id="cancelJob" class="primary danger">Cancel backup</button></div>','details',true);
 detailId=id;$('cancelJob').onclick=()=>cancelDialog(id);updateDetails();
}
function updateDetails(){
 const job=jobs.get(detailId);if(!job)return;
 $('jobDetails').className='details '+job.state;
 $('jobTitle').textContent=`${job.name} — ${job.state}`;
 $('jobProgress').value=job.percent||0;$('jobPercent').textContent=(job.percent||0)+'%';
 $('jobSource').textContent=job.source||'Scanning…';$('jobDestination').textContent=job.destination||'Preparing…';
 $('jobFiles').textContent=`${job.files||0} / ${job.totalFiles||0}`;
 $('jobBytes').textContent=`${size(job.bytes)} / ${size(job.totalBytes)}`;
 $('jobDetail').textContent=job.detail||'';
 $('cancelJob').hidden=job.state!=='running';$('cancelJob').disabled=!!job.cancelRequested;
 $('cancelJob').textContent=job.cancelRequested?'Cancelling…':'Cancel backup';
}
function cancelDialog(id){
 const job=jobs.get(id);if(!job||job.state!=='running'||job.cancelRequested)return;
 openModal('Cancel Backup',`<p>Are you sure you want to cancel <strong>${esc(job.name||'Backup')}</strong>?</p><div class="actions"><button onclick="closeModal()">No</button><button id="confirmCancel" class="danger">Yes</button></div>`,'cancel');
 $('confirmCancel').onclick=()=>{
  const current=jobs.get(id);
  if(current?.state==='running'&&!current.cancelRequested){current.cancelRequested=true;send('cancel',{id});renderJobs();}
  closeModal();
 };
}function confirmExit(){openModal('Exit FileBackup?','<p>Backups are still running. Keep them running, or cancel them and exit after cleanup.</p><div class="actions"><button onclick="closeModal()">Keep running</button><button id="cancelAll" class="danger">Cancel backups and exit</button></div>','exit');$('cancelAll').onclick=()=>{send('exit',{confirmed:true});closeModal();toast('Cancelling backups before exiting.')}}
let idleTimer, idleDeadline=0, uiIdle=false;
function checkUiIdle(){
 const remaining=idleDeadline-Date.now();
 if(remaining>0){idleTimer=setTimeout(checkUiIdle,remaining);return;}
 idleTimer=null;uiIdle=true;send('uiIdle');
}
function markUiActive(){
 if(uiIdle){uiIdle=false;send('uiActive');}
 idleDeadline=Date.now()+30000;
 // Input updates the deadline without creating a timer on every pointer move.
 if(idleTimer==null)idleTimer=setTimeout(checkUiIdle,30000);
}
for(const event of ['pointermove','pointerdown','keydown','focus'])window.addEventListener(event,markUiActive,{passive:true});
window.addEventListener('DOMContentLoaded',()=>{send('ready');markUiActive();});
</script></body></html>
