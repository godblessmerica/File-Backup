[package]
name = "filebackup"
version = "0.3.1"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
flate2 = "1"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tao = "0.37"
wry = "0.57"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.26", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
